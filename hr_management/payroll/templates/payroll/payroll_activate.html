{% extends 'payroll/base_payroll.html' %}

{% block title %}Kích hoạt bảng lương{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="card">
        <div class="card-body">
            <h4 class="mb-3"><i class="bi bi-check-circle me-2"></i>Kích hoạt bảng lương</h4>
            <p>Bảng lương <strong>{{ payroll.name }}</strong> sẽ được đưa về trạng thái <span class="badge bg-secondary">Nháp</span>.</p>
            <form method="post" class="d-flex gap-2">
                {% csrf_token %}
                <a href="{% url 'payroll_detail' pk=payroll.pk %}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i> Quay lại
                </a>
                <button type="submit" class="btn btn-success">
                    <i class="bi bi-check-circle me-1"></i> Kích hoạt
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
